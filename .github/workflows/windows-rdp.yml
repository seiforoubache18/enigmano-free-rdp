name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        net user runneradmin "P@ssw0rd!"

    - name: Start SSH Tunnel (No Card Required)
      run: |
        # استخدام خدمة localhost.run المجانية لإنشاء نفق TCP
        Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 nokey@localhost.run" -NoNewWindow -RedirectStandardOutput "tunnel.out" -RedirectStandardError "tunnel.err"
        Start-Sleep -Seconds 20

    - name: Show Connection Details
      run: |
        $log = Get-Content tunnel.err -Raw -ErrorAction SilentlyContinue
        $log2 = Get-Content tunnel.out -Raw -ErrorAction SilentlyContinue
        $all_logs = "$log $log2"
        
        Write-Host "Tunnel Logs:"
        Write-Host $all_logs
        
        if ($all_logs -match '(tcp://[a-zA-Z0-9.-]+:\d+)') {
            $rdp_ip = $matches[1] -replace "tcp://", ""
            Write-Host "====================================="
            Write-Host "RDP IP: $rdp_ip" -ForegroundColor Green
            Write-Host "Username: runneradmin"
            Write-Host "Password: P@ssw0rd!"
            Write-Host "====================================="
        } else {
            Write-Host "Could not find IP in tunnel logs. Please check the logs above." -ForegroundColor Red
        }
        Start-Sleep -Seconds 21600
