name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "fPromptForPassword" -Value 0
        net user runneradmin "P@ssw0rd!"
        Write-Host "RDP Enabled Successfully!"

    - name: Start Bore Tunnel
      run: |
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "."
        
        # استخدام CMD لتجنب خطأ PowerShell في إعادة التوجيه
        Start-Process -FilePath "cmd.exe" -ArgumentList "/c .\bore.exe local 3389 --to bore.pub > bore_out.log 2> bore_err.log" -NoNewWindow
        Start-Sleep -Seconds 10

    - name: Show Connection Details
      run: |
        $out_log = Get-Content bore_out.log -Raw -ErrorAction SilentlyContinue
        $err_log = Get-Content bore_err.log -Raw -ErrorAction SilentlyContinue
        $all_logs = "$out_log $err_log"
        
        Write-Host "Bore Logs:" -ForegroundColor Yellow
        Write-Host $all_logs
        
        if ($all_logs -match 'listening at (bore\.pub:\d+)') {
            $rdp_ip = $matches[1]
            Write-Host "====================================="
            Write-Host "RDP IP: $rdp_ip" -ForegroundColor Green
            Write-Host "Username: runneradmin"
            Write-Host "Password: P@ssw0rd!"
            Write-Host "====================================="
        } else {
            Write-Host "Could not find IP. Check logs." -ForegroundColor Red
        }
        
        Start-Sleep -Seconds 21600
