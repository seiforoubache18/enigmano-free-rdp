name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        net user runneradmin "P@ssw0rd!"

    - name: Start Pinggy Tunnel
      run: |
        # تشغيل نفق Pinggy في الخلفية
        Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R0:localhost:3389 a.pinggy.io" -NoNewWindow -RedirectStandardOutput "tunnel.out" -RedirectStandardError "tunnel.err"
        Start-Sleep -Seconds 15

    - name: Show Connection Details
      run: |
        $log = Get-Content tunnel.out -Raw -ErrorAction SilentlyContinue
        $err = Get-Content tunnel.err -Raw -ErrorAction SilentlyContinue
        $all_logs = "$log $err"
        
        Write-Host "Tunnel Logs:"
        Write-Host $all_logs
        
        # استخراج الـ IP الخاص بـ Pinggy
        $matches = [regex]::Matches($all_logs, 'tcp://([a-zA-Z0-9.-]+:\d+)')
        if ($matches.Count -gt 0) {
            $rdp_ip = $matches[0].Groups[1].Value
            Write-Host "====================================="
            Write-Host "RDP IP: $rdp_ip" -ForegroundColor Green
            Write-Host "Username: runneradmin"
            Write-Host "Password: P@ssw0rd!"
            Write-Host "====================================="
        } else {
            Write-Host "Could not find IP in tunnel logs. Please check the logs above." -ForegroundColor Red
        }
        # إبقاء السيرفر يعمل لمدة 6 ساعات
        Start-Sleep -Seconds 21600
