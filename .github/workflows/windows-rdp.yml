name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Start Ngrok Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_SHAHZAIB }}
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        .\ngrok.exe config add-authtoken $env:NGROK_TOKEN
        Start-Process -FilePath .\ngrok.exe -ArgumentList "tcp 3389" -NoNewWindow

    - name: Show Connection Details
      run: |
        Start-Sleep -Seconds 15
        $response = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
        $rdp_ip = $response.tunnels[0].public_url -replace "tcp://", ""
        Write-Host "====================================="
        Write-Host "RDP IP: $rdp_ip"
        Write-Host "Username: runneradmin"
        Write-Host "Password: P@ssw0rd!"
        Write-Host "====================================="
        Start-Sleep -Seconds 21600
