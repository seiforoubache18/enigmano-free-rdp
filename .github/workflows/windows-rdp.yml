name: EnigMano Instance Deployment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        net user runneradmin "P@ssw0rd!"

    - name: Download and Start Bore Tunnel
      run: |
        # تحميل أداة bore المجانية
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "."
        
        # تشغيل النفق في الخلفية
        Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -NoNewWindow -RedirectStandardError "bore.err"
        Start-Sleep -Seconds 10

    - name: Show Connection Details
      run: |
        $log = Get-Content bore.err -Raw -ErrorAction SilentlyContinue
        Write-Host "Bore Logs:"
        Write-Host $log
        
        # استخراج العنوان من السجلات
        if ($log -match 'listening at (bore\.pub:\d+)') {
            $rdp_ip = $matches[1]
            Write-Host "====================================="
            Write-Host "RDP IP: $rdp_ip" -ForegroundColor Green
            Write-Host "Username: runneradmin"
            Write-Host "Password: P@ssw0rd!"
            Write-Host "====================================="
        } else {
            Write-Host "Could not find IP in tunnel logs." -ForegroundColor Red
        }
        
        # إبقاء السيرفر يعمل لمدة 6 ساعات
        Start-Sleep -Seconds 21600
